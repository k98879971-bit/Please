name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Godot 4.7.1 editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --version

      - name: Install Android SDK (platform-tools + build-tools 35)
        env:
          ANDROID_HOME: /opt/android-sdk
        run: |
          wget -q -O /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Install Godot Android export template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          wget -q -O ~/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_android_debug.perfetto.apk

      - name: Configure Godot editor (Java + Android SDK paths)
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --editor --quit || true
          SET=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          JDK=$(dirname $(dirname $(readlink -f $(command -v javac))))
          sed -i "s|export/android/java_sdk_path = \".*\"|export/android/java_sdk_path = \"$JDK\"|" "$SET"
          sed -i 's|export/android/android_sdk_path = ".*"|export/android/android_sdk_path = "/opt/android-sdk"|' "$SET"

      - name: Import + export Android debug APK
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --import || true
          mkdir -p build
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --export-debug "Android Debug" "build/PixelSurvival-debug.apk"
          ls -lh build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-survival-debug-apk
          path: build/*.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pixel-survival-debug-apk
          path: build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.0-build${{ github.run_number }}"
          gh release create "$TAG" build/*.apk --title "$TAG" \
            --notes "Автоматическая сборка debug-APK. Godot 4.7.1, Android export." --prerelease
